name: ${WORKSHOP_ID:?Run through workshop}

x-runtime: &runtime
  build:
    context: ${WORKSHOP_RECIPE:?Run through workshop}
    args:
      CODEX_VERSION: ${CODEX_VERSION:-latest}
      WORKSHOP_TOOLS: all
      WORKSHOP_HOME: ${WORKSHOP_HOME:?Run through workshop}

  image: ${CODEX_IMAGE:?Run through workshop}
  user: "${HOST_UID}:${HOST_GID}"
  working_dir: ${WORKSHOP_HOME:?Run through workshop}/work

  environment:
    HOME: ${WORKSHOP_HOME:?Run through workshop}
    USER: ${WORKSHOP_USER:?Run through workshop}
    LOGNAME: ${WORKSHOP_USER:?Run through workshop}
    XDG_CACHE_HOME: ${WORKSHOP_HOME:?Run through workshop}/.cache
    NPM_CONFIG_CACHE: ${WORKSHOP_HOME:?Run through workshop}/.npm
    TERM: ${TERM:-xterm-256color}

  stdin_open: true
  tty: true
  read_only: true

  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

  network_mode: bridge

  volumes:
    - type: bind
      source: ${CODEX_RAM_DIR:?Run through workshop}
      target: ${WORKSHOP_HOME:?Run through workshop}
      bind:
        create_host_path: false

  tmpfs:
    - /tmp:rw,exec,nosuid,nodev,size=2g

  pids_limit: 2048
  mem_limit: ${WORKSHOP_MEMORY_LIMIT:?Run through workshop}
  init: true

services:
  codex:
    <<: *runtime
    entrypoint: codex

  claude:
    <<: *runtime
    entrypoint: claude

  opencode:
    <<: *runtime
    entrypoint: opencode

  maintain:
    <<: *runtime
    profiles: [maintenance]
    user: "0:0"
    entrypoint: /bin/bash
    read_only: false
    cap_drop: []
    security_opt: []
